<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicBox - Panel Zarządzania</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div x-data="musicBox()" x-init="init()" class="container mx-auto px-4 py-8 max-w-4xl">
        <!-- Header -->
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-gray-800 flex items-center gap-3">
                <span class="text-4xl">🎵</span>
                MusicBox
            </h1>
            <p class="text-gray-600 mt-1">Panel zarządzania</p>
        </header>

        <!-- Tabs -->
        <div class="mb-6">
            <nav class="flex space-x-4">
                <button
                    @click="activeTab = 'tracks'"
                    :class="activeTab === 'tracks' ? 'bg-blue-500 text-white' : 'bg-white text-gray-700 hover:bg-gray-50'"
                    class="px-4 py-2 rounded-lg font-medium transition-colors">
                    Utwory
                </button>
                <button
                    @click="activeTab = 'figurines'"
                    :class="activeTab === 'figurines' ? 'bg-blue-500 text-white' : 'bg-white text-gray-700 hover:bg-gray-50'"
                    class="px-4 py-2 rounded-lg font-medium transition-colors">
                    Figurki
                </button>
            </nav>
        </div>

        <!-- Notification -->
        <div x-show="notification.show"
             x-transition
             x-cloak
             :class="notification.type === 'error' ? 'bg-red-100 border-red-400 text-red-700' : 'bg-green-100 border-green-400 text-green-700'"
             class="mb-4 px-4 py-3 rounded border">
            <span x-text="notification.message"></span>
        </div>

        <!-- Tracks Tab -->
        <div x-show="activeTab === 'tracks'" x-cloak>
            <!-- Upload Form -->
            <div class="bg-white rounded-lg shadow p-6 mb-6">
                <h2 class="text-lg font-semibold mb-4">Dodaj utwór</h2>
                <form @submit.prevent="uploadTrack()" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Tytuł</label>
                        <input
                            type="text"
                            x-model="newTrack.title"
                            required
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                            placeholder="Nazwa utworu">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Plik MP3</label>
                        <input
                            type="file"
                            @change="newTrack.file = $event.target.files[0]"
                            accept=".mp3"
                            required
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <button
                        type="submit"
                        :disabled="uploading"
                        class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 disabled:opacity-50 disabled:cursor-not-allowed">
                        <span x-show="!uploading">Dodaj utwór</span>
                        <span x-show="uploading">Przesyłanie...</span>
                    </button>
                </form>
            </div>

            <!-- Tracks List -->
            <div class="bg-white rounded-lg shadow">
                <div class="p-4 border-b">
                    <h2 class="text-lg font-semibold">Lista utworów</h2>
                </div>
                <div class="divide-y">
                    <template x-if="tracks.length === 0">
                        <div class="p-4 text-gray-500 text-center">
                            Brak utworów. Dodaj pierwszy utwór powyżej.
                        </div>
                    </template>
                    <template x-for="track in tracks" :key="track.id">
                        <div class="p-4 flex items-center justify-between hover:bg-gray-50">
                            <div class="flex items-center gap-3">
                                <span class="text-2xl">🎵</span>
                                <div>
                                    <div class="font-medium" x-text="track.title"></div>
                                    <div class="text-sm text-gray-500" x-text="track.filename"></div>
                                </div>
                            </div>
                            <div class="flex items-center gap-2">
                                <button
                                    @click="playTrack(track)"
                                    class="p-2 text-gray-600 hover:text-blue-500 hover:bg-blue-50 rounded-lg"
                                    title="Odtwórz">
                                    ▶️
                                </button>
                                <button
                                    @click="deleteTrack(track)"
                                    class="p-2 text-gray-600 hover:text-red-500 hover:bg-red-50 rounded-lg"
                                    title="Usuń">
                                    🗑️
                                </button>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

            <!-- Audio Player -->
            <audio x-ref="audioPlayer" class="hidden"></audio>
        </div>

        <!-- Figurines Tab -->
        <div x-show="activeTab === 'figurines'" x-cloak>
            <!-- Add Figurine Form -->
            <div class="bg-white rounded-lg shadow p-6 mb-6">
                <h2 class="text-lg font-semibold mb-4">Dodaj figurkę</h2>
                <form @submit.prevent="createFigurine()" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Nazwa figurki</label>
                            <input
                                type="text"
                                x-model="newFigurine.name"
                                required
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                                placeholder="np. Elsa, Simba">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Kod NFC (UID)</label>
                            <input
                                type="text"
                                x-model="newFigurine.nfc_uid"
                                required
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                                placeholder="np. <example-nfc-uid>">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Przypisany utwór (opcjonalnie)</label>
                        <select
                            x-model="newFigurine.track_id"
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                            <option value="">-- Brak (placeholder) --</option>
                            <template x-for="track in tracks" :key="track.id">
                                <option :value="track.id" x-text="track.title"></option>
                            </template>
                        </select>
                    </div>
                    <button
                        type="submit"
                        class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600">
                        Dodaj figurkę
                    </button>
                </form>
            </div>

            <!-- Figurines List -->
            <div class="bg-white rounded-lg shadow">
                <div class="p-4 border-b">
                    <h2 class="text-lg font-semibold">Lista figurek</h2>
                </div>
                <div class="divide-y">
                    <template x-if="figurines.length === 0">
                        <div class="p-4 text-gray-500 text-center">
                            Brak figurek. Dodaj pierwszą figurkę powyżej.
                        </div>
                    </template>
                    <template x-for="figurine in figurines" :key="figurine.id">
                        <div class="p-4 hover:bg-gray-50">
                            <!-- View Mode -->
                            <div x-show="editingFigurine?.id !== figurine.id" class="flex items-center justify-between">
                                <div class="flex items-center gap-4">
                                    <span class="text-2xl">🧸</span>
                                    <div>
                                        <div class="font-medium" x-text="figurine.name"></div>
                                        <div class="text-sm text-gray-500 font-mono" x-text="figurine.nfc_uid"></div>
                                    </div>
                                </div>
                                <div class="flex items-center gap-4">
                                    <div class="text-sm">
                                        <span x-show="figurine.track" class="text-green-600" x-text="'🎵 ' + figurine.track?.title"></span>
                                        <span x-show="!figurine.track" class="text-gray-400">(brak utworu)</span>
                                    </div>
                                    <div class="flex items-center gap-2">
                                        <button
                                            @click="startEditFigurine(figurine)"
                                            class="p-2 text-gray-600 hover:text-blue-500 hover:bg-blue-50 rounded-lg"
                                            title="Edytuj">
                                            ✏️
                                        </button>
                                        <button
                                            @click="deleteFigurine(figurine)"
                                            class="p-2 text-gray-600 hover:text-red-500 hover:bg-red-50 rounded-lg"
                                            title="Usuń">
                                            🗑️
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <!-- Edit Mode -->
                            <div x-show="editingFigurine?.id === figurine.id" class="space-y-3">
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 mb-1">Nazwa</label>
                                        <input
                                            type="text"
                                            x-model="editingFigurine.name"
                                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 mb-1">Utwór</label>
                                        <select
                                            x-model="editingFigurine.track_id"
                                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
                                            <option value="0">-- Brak --</option>
                                            <template x-for="track in tracks" :key="track.id">
                                                <option :value="track.id" x-text="track.title"></option>
                                            </template>
                                        </select>
                                    </div>
                                </div>
                                <div class="flex gap-2">
                                    <button
                                        @click="saveFigurine()"
                                        class="bg-green-500 text-white px-3 py-1 rounded hover:bg-green-600 text-sm">
                                        Zapisz
                                    </button>
                                    <button
                                        @click="editingFigurine = null"
                                        class="bg-gray-300 text-gray-700 px-3 py-1 rounded hover:bg-gray-400 text-sm">
                                        Anuluj
                                    </button>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </div>

    <script>
        function musicBox() {
            return {
                activeTab: 'tracks',
                tracks: [],
                figurines: [],
                newTrack: { title: '', file: null },
                newFigurine: { name: '', nfc_uid: '', track_id: '' },
                editingFigurine: null,
                uploading: false,
                notification: { show: false, message: '', type: 'success' },

                async init() {
                    await this.loadTracks();
                    await this.loadFigurines();
                },

                showNotification(message, type = 'success') {
                    this.notification = { show: true, message, type };
                    setTimeout(() => {
                        this.notification.show = false;
                    }, 3000);
                },

                async loadTracks() {
                    try {
                        const res = await fetch('/admin/tracks');
                        this.tracks = await res.json();
                    } catch (e) {
                        this.showNotification('Błąd ładowania utworów', 'error');
                    }
                },

                async loadFigurines() {
                    try {
                        const res = await fetch('/admin/figurines');
                        this.figurines = await res.json();
                    } catch (e) {
                        this.showNotification('Błąd ładowania figurek', 'error');
                    }
                },

                async uploadTrack() {
                    if (!this.newTrack.file || !this.newTrack.title) return;

                    this.uploading = true;
                    const formData = new FormData();
                    formData.append('title', this.newTrack.title);
                    formData.append('file', this.newTrack.file);

                    try {
                        const res = await fetch('/admin/tracks', {
                            method: 'POST',
                            body: formData
                        });

                        if (res.ok) {
                            this.showNotification('Utwór dodany');
                            this.newTrack = { title: '', file: null };
                            await this.loadTracks();
                        } else {
                            const err = await res.json();
                            this.showNotification(err.detail || 'Błąd dodawania', 'error');
                        }
                    } catch (e) {
                        this.showNotification('Błąd połączenia', 'error');
                    }
                    this.uploading = false;
                },

                async deleteTrack(track) {
                    if (!confirm(`Usunąć utwór "${track.title}"?`)) return;

                    try {
                        const res = await fetch(`/admin/tracks/${track.id}`, { method: 'DELETE' });
                        if (res.ok) {
                            this.showNotification('Utwór usunięty');
                            await this.loadTracks();
                            await this.loadFigurines();
                        } else {
                            this.showNotification('Błąd usuwania', 'error');
                        }
                    } catch (e) {
                        this.showNotification('Błąd połączenia', 'error');
                    }
                },

                playTrack(track) {
                    const audio = this.$refs.audioPlayer;
                    audio.src = `/api/stream/${track.id}`;
                    audio.play();
                },

                async createFigurine() {
                    if (!this.newFigurine.name || !this.newFigurine.nfc_uid) return;

                    const data = {
                        name: this.newFigurine.name,
                        nfc_uid: this.newFigurine.nfc_uid,
                        track_id: this.newFigurine.track_id ? parseInt(this.newFigurine.track_id) : null
                    };

                    try {
                        const res = await fetch('/admin/figurines', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(data)
                        });

                        if (res.ok) {
                            this.showNotification('Figurka dodana');
                            this.newFigurine = { name: '', nfc_uid: '', track_id: '' };
                            await this.loadFigurines();
                        } else {
                            const err = await res.json();
                            this.showNotification(err.detail || 'Błąd dodawania', 'error');
                        }
                    } catch (e) {
                        this.showNotification('Błąd połączenia', 'error');
                    }
                },

                startEditFigurine(figurine) {
                    this.editingFigurine = {
                        id: figurine.id,
                        name: figurine.name,
                        track_id: figurine.track_id || 0
                    };
                },

                async saveFigurine() {
                    const data = {
                        name: this.editingFigurine.name,
                        track_id: parseInt(this.editingFigurine.track_id) || 0
                    };

                    try {
                        const res = await fetch(`/admin/figurines/${this.editingFigurine.id}`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(data)
                        });

                        if (res.ok) {
                            this.showNotification('Figurka zaktualizowana');
                            this.editingFigurine = null;
                            await this.loadFigurines();
                        } else {
                            const err = await res.json();
                            this.showNotification(err.detail || 'Błąd aktualizacji', 'error');
                        }
                    } catch (e) {
                        this.showNotification('Błąd połączenia', 'error');
                    }
                },

                async deleteFigurine(figurine) {
                    if (!confirm(`Usunąć figurkę "${figurine.name}"?`)) return;

                    try {
                        const res = await fetch(`/admin/figurines/${figurine.id}`, { method: 'DELETE' });
                        if (res.ok) {
                            this.showNotification('Figurka usunięta');
                            await this.loadFigurines();
                        } else {
                            this.showNotification('Błąd usuwania', 'error');
                        }
                    } catch (e) {
                        this.showNotification('Błąd połączenia', 'error');
                    }
                }
            };
        }
    </script>
</body>
</html>
