; PlatformIO Project Configuration File
; zBox - Muzyczne Pudełko dla Dzieci
;
; Upload + monitor:  pio run -t upload && pio device monitor

[platformio]
default_envs = lolin_d32_pro

[env:lolin_d32_pro]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = lolin_d32_pro
framework = arduino, espidf
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = custom_4mb_ota.csv
lib_deps =
    https://github.com/pschatzmann/arduino-audio-tools.git
    https://github.com/pschatzmann/arduino-libhelix.git
    adafruit/Adafruit PN532@^1.3.0
    bblanchon/ArduinoJson@^7.0.0
    https://github.com/tzapu/WiFiManager.git
    fastled/FastLED@^3.6.0
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM=1
    -mfix-esp32-psram-cache-issue
    -Os
    -std=gnu++17
    -I src
    -I src/core
    -I src/audio
    -I src/leds
    -I src/input
    -I src/nfc
    -I src/storage
    -I src/power
    -I src/modes
    -I src/util
build_src_filter =
    +<*.cpp>
    +<core/*.cpp>
    +<audio/*.cpp>
    +<leds/*.cpp>
    +<input/*.cpp>
    +<nfc/*.cpp>
    +<storage/*.cpp>
    +<power/*.cpp>
    +<modes/*.cpp>
    +<util/*.cpp>
build_type = release
extra_scripts =
    pre:updatesdkconfig.py
    pre:generate_certs.py

[env:lolin_d32_pro_ota]
extends = env:lolin_d32_pro
upload_protocol = espota

[env:native]
platform = native
build_src_filter = -<*>
build_flags =
    -std=c++17
    -DNATIVE_BUILD
    -I test/test_bt_adapter/stubs
    -I src
    -I src/core
    -I src/audio
    -I src/leds
    -I src/input
    -I src/nfc
    -I src/storage
    -I src/power
    -I src/modes
    -I src/util
    -I test
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
test_filter = test_uid_format, test_volume, test_mapping, test_reducer, test_bt_adapter, test_audio_adapter, test_dispatcher

[env:native_btndec]
platform = native
build_src_filter = -<*>
build_flags =
    -std=c++17
    -DNATIVE_BUILD
    -I test/test_button_decoder/stubs
    -I src
    -I src/core
    -I src/audio
    -I src/leds
    -I src/input
    -I src/nfc
    -I src/storage
    -I src/power
    -I src/modes
    -I src/util
    -I test
test_filter = test_button_decoder
