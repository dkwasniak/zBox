; PlatformIO Project Configuration File
; MusicBox - Muzyczne Pudełko dla Dzieci
;
; Upload: pio run -t upload
; Monitor: pio device monitor

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino

; Prędkość uploadu i monitora
monitor_speed = 115200
upload_speed = 460800

; Biblioteki
lib_deps =
    adafruit/Adafruit PN532@^1.3.0
    bblanchon/ArduinoJson@^7.0.0
    ayushsharma82/WebSerial@^2.0.8
    esp32async/AsyncTCP@^3.2.14
    esp32async/ESPAsyncWebServer@^3.6.0

; Flagi kompilacji
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM=0
    ; Configure these locally only. Do not commit real credentials.
    ; -DWIFI_SSID=\"your-wifi-ssid\"
    ; -DWIFI_PASSWORD=\"your-wifi-password\"
    ; -DSERVER_HOST=\"musicbox-server.local\"

; Partycje z OTA support (2x app ~1.9MB)
board_build.partitions = min_spiffs.csv

; OTA upload (po pierwszym wgraniu przez USB)
; Odkomentuj i zmień IP na aktualny ESP32:
; upload_protocol = espota
; upload_port = <esp32-ip>
