; PlatformIO Project Configuration File
; MusicBox - Muzyczne Pudełko dla Dzieci
;
; Upload + monitor:  pio run -t upload && pio device monitor

[env:lolin_d32_pro]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = lolin_d32_pro
framework = arduino, espidf
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = custom_4mb_noota.csv
lib_deps =
    https://github.com/pschatzmann/arduino-audio-tools.git
    https://github.com/pschatzmann/ESP32-A2DP.git
    https://github.com/pschatzmann/arduino-libhelix.git
    adafruit/Adafruit PN532@^1.3.0
    bblanchon/ArduinoJson@^7.0.0
    https://github.com/tzapu/WiFiManager.git
    fastled/FastLED@^3.6.0
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM=1
    -mfix-esp32-psram-cache-issue
    -Os
    -std=gnu++17
build_type = release
extra_scripts =
    pre:updatesdkconfig.py
    pre:generate_certs.py
