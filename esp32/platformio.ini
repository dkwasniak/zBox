; PlatformIO Project Configuration File
; MusicBox - Muzyczne Pudełko dla Dzieci
;
; Upload: pio run -t upload
; Monitor: pio device monitor

[env:lolin_d32_pro]
platform = espressif32
board = lolin_d32_pro
framework = arduino

; Prędkość uploadu i monitora
monitor_speed = 115200
upload_speed = 460800

; Biblioteki (starsza wersja audio bez wymagania C++20)
lib_deps =
    https://github.com/schreibfaul1/ESP32-audioI2S.git#3.0.12
    adafruit/Adafruit PN532@^1.3.0
    https://github.com/tzapu/WiFiManager.git
    bblanchon/ArduinoJson@^7.0.0

; Flagi kompilacji
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM=1
    -mfix-esp32-psram-cache-issue

; Partycje z większą przestrzenią na aplikację
board_build.partitions = huge_app.csv
